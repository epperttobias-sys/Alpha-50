name: MSCI-World-Daten aktualisieren

on:
  schedule:
    - cron: "7,37 * * * 1-5"   # Mo–Fr alle 30 Minuten (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - run: python scripts/update_data.py
      - name: data.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json shares.json
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git commit -m "Daten aktualisiert"
          git pull --rebase
          git push
